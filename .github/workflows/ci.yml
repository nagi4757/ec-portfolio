name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test backend
        run: ./gradlew clean build --no-daemon

      - name: Run backend integration tests
        run: ./gradlew integrationTest --no-daemon

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint store web
        run: npm run lint --workspace=store-web

      - name: Build store web
        run: npm run build --workspace=store-web

      - name: Lint admin web
        run: npm run lint --workspace=admin-web

      - name: Build admin web
        run: npm run build --workspace=admin-web

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify RDS CA bundle source
        run: |
          set -eu
          ca_file=apps/api/docker/aws-rds-ap-northeast-1-bundle.pem
          test -s "$ca_file"
          begin_count="$(grep -c '^-----BEGIN CERTIFICATE-----$' "$ca_file")"
          end_count="$(grep -c '^-----END CERTIFICATE-----$' "$ca_file")"
          test "$begin_count" -gt 0
          test "$begin_count" -eq "$end_count"
          ! grep -Eq '^-----BEGIN .*PRIVATE KEY-----$' "$ca_file"
          openssl crl2pkcs7 -nocrl -certfile "$ca_file" \
            | openssl pkcs7 -print_certs -noout >/dev/null

      - name: Build production image
        run: docker build --tag ec-api:ci apps/api

      - name: Verify image metadata
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' ec-api:ci)" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' ec-api:ci)" = '["java","-jar","/app/app.jar"]'
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' ec-api:ci)" = '{"8080/tcp":{}}'

      - name: Verify runtime image contents
        run: |
          docker run --rm --entrypoint sh ec-api:ci -c '
            set -eu
            test -f /app/app.jar
            test "$(find /app -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
            command -v curl
            ! command -v gradle
            test ! -e /workspace
            test ! -e /app/gradlew
            test ! -e /app/gradle
            test ! -e /app/src
            test ! -e /app/build
            ca_file=/etc/ssl/certs/aws-rds-ap-northeast-1-bundle.pem
            test -s "$ca_file"
            test -r "$ca_file"
            test "$(stat -c %a "$ca_file")" = "444"
            test "$(stat -c %u:%g "$ca_file")" = "0:0"
            grep -q "^-----BEGIN CERTIFICATE-----$" "$ca_file"
            ! grep -Eq "^-----BEGIN .*PRIVATE KEY-----$" "$ca_file"
          '

      - name: Verify runtime image contains no secret configuration
        run: |
          ! docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' ec-api:ci \
            | grep -Eq 'DB_PASSWORD|REDIS_PASSWORD|APP_AUTH_JWT_SECRET'
          ! docker history --no-trunc --format '{{.CreatedBy}}' ec-api:ci \
            | grep -Eq 'DB_PASSWORD|REDIS_PASSWORD|APP_AUTH_JWT_SECRET'

  deploy-frontends:
    name: Deploy Store and Admin frontends
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo-frontend
    concurrency:
      group: demo-frontend-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      VITE_API_BASE_URL: https://d1q0vfmnxby7vo.cloudfront.net
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_FRONTEND_DEPLOY_ROLE_ARN: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
      STORE_BUCKET_NAME: ${{ vars.STORE_BUCKET_NAME }}
      ADMIN_BUCKET_NAME: ${{ vars.ADMIN_BUCKET_NAME }}
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject a stale queued deployment
        run: |
          set -euo pipefail
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main_sha"
          test "$GITHUB_SHA" = "$remote_main_sha"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Test frontend deployment contract
        run: infra/runtime/demo/deploy-frontends.test.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Store for production
        run: npm run build --workspace=store-web

      - name: Build Admin for production
        run: npm run build --workspace=admin-web

      - name: Validate deployment environment
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$AWS_FRONTEND_DEPLOY_ROLE_ARN" = \
            "arn:aws:iam::$AWS_ACCOUNT_ID:role/ec-portfolio-demo-github-frontend-deploy"
          test "$STORE_BUCKET_NAME" = "ec-portfolio-demo-store-9351f7fce5bae83f06adb05d90"
          test "$ADMIN_BUCKET_NAME" = "ec-portfolio-demo-admin-5a49cc7398a4e653e084d73148"
          test "$VITE_API_BASE_URL" = "https://d1q0vfmnxby7vo.cloudfront.net"

      - name: Validate production artifacts
        env:
          RELEASE_SHA: ${{ github.sha }}
          STORE_DIST_DIR: apps/store-web/dist
          ADMIN_DIST_DIR: apps/admin-web/dist
        run: infra/runtime/demo/deploy-frontends.sh validate

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          role-session-name: gha-frontend-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Deploy immutable frontend release
        env:
          RELEASE_SHA: ${{ github.sha }}
          STORE_DIST_DIR: apps/store-web/dist
          ADMIN_DIST_DIR: apps/admin-web/dist
        run: infra/runtime/demo/deploy-frontends.sh deploy

  build-and-push-api:
    name: Publish Demo API image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo-backend
    concurrency:
      group: demo-backend-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_BACKEND_DEPLOY_ROLE_ARN: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY_NAME: ec-portfolio-demo-api
      BUILD_CONTEXT: apps/api
      MIGRATION_PATH: apps/api/src/main/resources/db/migration
      DESIRED_IMAGE_SHA_PARAMETER: /ec-portfolio/demo/deploy/desired-image-sha
      LAST_KNOWN_GOOD_IMAGE_SHA_PARAMETER: /ec-portfolio/demo/deploy/last-known-good-image-sha
      PENDING_MIGRATION_IMAGE_SHA_PARAMETER: /ec-portfolio/demo/deploy/pending-migration-image-sha
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout reviewed main commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a stale queued publication
        run: |
          set -euo pipefail
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main_sha"
          test "$GITHUB_SHA" = "$remote_main_sha"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Test API publication contract
        run: infra/runtime/demo/publish-api-image.test.sh

      - name: Validate publication environment
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$AWS_BACKEND_DEPLOY_ROLE_ARN" = \
            "arn:aws:iam::$AWS_ACCOUNT_ID:role/ec-portfolio-demo-github-backend-deploy"
          test "$ECR_REPOSITORY_NAME" = "ec-portfolio-demo-api"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          role-session-name: gha-backend-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Publish the immutable API image
        run: infra/runtime/demo/publish-api-image.sh ensure-image

      - name: Block an automatic release that changes Flyway migrations
        run: infra/runtime/demo/publish-api-image.sh migration-guard

      - name: Require a recoverable rollback image
        run: infra/runtime/demo/publish-api-image.sh assert-rollback-image

      - name: Record the desired API image
        run: infra/runtime/demo/publish-api-image.sh record-desired

  deploy-api:
    name: Deploy Demo API
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-push-api
    runs-on: ubuntu-latest
    # Must outlast role-duration-seconds below, so an expiring credential is
    # what fails a stuck deployment rather than the job being cut off first.
    # deploy-runtime.test.sh reads both values from this file and enforces
    # poll budget < role-duration-seconds < job timeout.
    timeout-minutes: 20
    environment: demo-backend
    concurrency:
      group: demo-backend-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_BACKEND_DEPLOY_ROLE_ARN: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject a stale queued deployment
        run: |
          set -euo pipefail
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main_sha"
          test "$GITHUB_SHA" = "$remote_main_sha"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Test runtime deployment contract
        run: |
          set -euo pipefail
          infra/runtime/demo/deploy-api-from-ssm.test.sh
          infra/runtime/demo/deploy-runtime.test.sh

      - name: Validate deployment environment
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$AWS_BACKEND_DEPLOY_ROLE_ARN" = \
            "arn:aws:iam::$AWS_ACCOUNT_ID:role/ec-portfolio-demo-github-backend-deploy"
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Deploy to the EC2 host when online
        run: infra/runtime/demo/deploy-runtime.sh deploy
