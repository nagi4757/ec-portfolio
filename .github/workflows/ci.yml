name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test backend
        run: ./gradlew clean build --no-daemon

      - name: Run backend integration tests
        run: ./gradlew integrationTest --no-daemon

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint store web
        run: npm run lint --workspace=store-web

      - name: Build store web
        run: npm run build --workspace=store-web

      - name: Lint admin web
        run: npm run lint --workspace=admin-web

      - name: Build admin web
        run: npm run build --workspace=admin-web

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify RDS CA bundle source
        run: |
          set -eu
          ca_file=apps/api/docker/aws-rds-ap-northeast-1-bundle.pem
          test -s "$ca_file"
          begin_count="$(grep -c '^-----BEGIN CERTIFICATE-----$' "$ca_file")"
          end_count="$(grep -c '^-----END CERTIFICATE-----$' "$ca_file")"
          test "$begin_count" -gt 0
          test "$begin_count" -eq "$end_count"
          ! grep -Eq '^-----BEGIN .*PRIVATE KEY-----$' "$ca_file"
          openssl crl2pkcs7 -nocrl -certfile "$ca_file" \
            | openssl pkcs7 -print_certs -noout >/dev/null

      - name: Build production image
        run: docker build --tag ec-api:ci apps/api

      - name: Verify image metadata
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' ec-api:ci)" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' ec-api:ci)" = '["java","-jar","/app/app.jar"]'
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' ec-api:ci)" = '{"8080/tcp":{}}'

      - name: Verify runtime image contents
        run: |
          docker run --rm --entrypoint sh ec-api:ci -c '
            set -eu
            test -f /app/app.jar
            test "$(find /app -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
            command -v curl
            ! command -v gradle
            test ! -e /workspace
            test ! -e /app/gradlew
            test ! -e /app/gradle
            test ! -e /app/src
            test ! -e /app/build
            ca_file=/etc/ssl/certs/aws-rds-ap-northeast-1-bundle.pem
            test -s "$ca_file"
            test -r "$ca_file"
            test "$(stat -c %a "$ca_file")" = "444"
            test "$(stat -c %u:%g "$ca_file")" = "0:0"
            grep -q "^-----BEGIN CERTIFICATE-----$" "$ca_file"
            ! grep -Eq "^-----BEGIN .*PRIVATE KEY-----$" "$ca_file"
          '

      - name: Verify runtime image contains no secret configuration
        run: |
          ! docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' ec-api:ci \
            | grep -Eq 'DB_PASSWORD|REDIS_PASSWORD|APP_AUTH_JWT_SECRET'
          ! docker history --no-trunc --format '{{.CreatedBy}}' ec-api:ci \
            | grep -Eq 'DB_PASSWORD|REDIS_PASSWORD|APP_AUTH_JWT_SECRET'

  # Runtime contract suites that gate a deployment run inside the deploy jobs, so
  # they are skipped on a pull request and again whenever the migration guard
  # stops deploy-api. The origin TLS suites verify the archive restore contract --
  # path traversal, symlink escape, device entries, setuid bits, key permissions --
  # which is a correctness property of the scripts themselves, not of a release.
  # It has to hold before review, on every pull request, so it is checked here
  # rather than behind a deployment.
  runtime-tests:
    name: Runtime shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test origin runtime install contract
        run: infra/runtime/demo/deploy-origin-runtime.test.sh

      # The release scope decides what a main push publishes and installs, so
      # its contract is checked on every pull request too, not only inside the
      # main-push jobs that act on it. Both suites run against stubs.
      - name: Test API release scope and runtime release contracts
        run: |
          set -euo pipefail
          infra/runtime/demo/publish-api-image.test.sh
          infra/runtime/demo/deploy-runtime.test.sh

      - name: Test origin TLS persistence contract
        run: |
          set -euo pipefail
          infra/runtime/demo/sync-origin-tls.test.sh
          infra/runtime/demo/origin-tls-writeback.test.sh
          infra/runtime/demo/origin-smoke-check-ecs.test.sh
          infra/runtime/demo/bootstrap-spot-host.test.sh

      - name: Test Spot host bootstrap hardening contract
        run: |
          set -euo pipefail
          infra/runtime/demo/imds-guard.test.sh
          infra/runtime/demo/spot-user-data-loader.test.sh
          infra/runtime/demo/spot-runtime-bundle.test.sh
          infra/runtime/demo/promote-origin-eip.test.sh

      - name: Test origin verification token rotation contract
        run: |
          set -euo pipefail
          infra/runtime/demo/configure-origin.test.sh
          infra/runtime/demo/origin-token-rotation-check.test.sh

      # The probe for the separate measurement cluster (not the production task).
      # --image also runs it inside the pinned Valkey image (BusyBox) with the
      # measurement task's constraints, and stops it as PID 1.
      - name: Test measurement memory probe contract
        run: infra/runtime/demo/ecs-memory-probe.test.sh --image

      # The load driver of the same measurement task. --image also runs it inside
      # the pinned Valkey image with real BusyBox wget against a local HTTP server
      # on the host network, and stops it as PID 1.
      - name: Test measurement load driver contract
        run: infra/runtime/demo/ecs-measurement-load.test.sh --image

      # The gate every saved plan of the measurement stack must pass before
      # apply: exact change set per mode, production no-op, content checks.
      - name: Test measurement stack plan gate
        run: infra/terraform/demo/scripts/measurement-plan-gate.test.sh

  deploy-frontends:
    name: Deploy Store and Admin frontends
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # deploy-api is a dependency so a release the API did not take cannot ship its
    # frontend alone. A migration change fails the guard inside build-and-push-api,
    # which skips deploy-api; without this the frontend would still go out and start
    # calling endpoints the running backend does not have. That is not hypothetical:
    # it is what the bdc3828 release did.
    #
    # An offline EC2 is deliberately not covered by this. deploy-api records the
    # desired SHA and exits successfully so boot convergence applies it later, and
    # the frontend follows as before -- that desired-state model is unchanged here.
    # The one exception: a release that changes the host runtime as well as the
    # API image fails deploy-api while the host is offline, before its desired
    # SHA is recorded (boot convergence cannot install runtime artifacts), and
    # this job waits with it.
    #
    # deploy-api always runs once build-and-push-api succeeds, also for a push
    # that releases nothing to the host, so this dependency never skips the
    # frontend of a push that does not touch the API.
    needs:
      - backend
      - frontend
      - docker
      - deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo-frontend
    concurrency:
      group: demo-frontend-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      VITE_API_BASE_URL: https://d1q0vfmnxby7vo.cloudfront.net
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_FRONTEND_DEPLOY_ROLE_ARN: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
      STORE_BUCKET_NAME: ${{ vars.STORE_BUCKET_NAME }}
      ADMIN_BUCKET_NAME: ${{ vars.ADMIN_BUCKET_NAME }}
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject a stale queued deployment
        run: |
          set -euo pipefail
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main_sha"
          test "$GITHUB_SHA" = "$remote_main_sha"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Test frontend deployment contract
        run: infra/runtime/demo/deploy-frontends.test.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Store for production
        run: npm run build --workspace=store-web

      - name: Build Admin for production
        run: npm run build --workspace=admin-web

      - name: Validate deployment environment
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$AWS_FRONTEND_DEPLOY_ROLE_ARN" = \
            "arn:aws:iam::$AWS_ACCOUNT_ID:role/ec-portfolio-demo-github-frontend-deploy"
          test "$STORE_BUCKET_NAME" = "ec-portfolio-demo-store-9351f7fce5bae83f06adb05d90"
          test "$ADMIN_BUCKET_NAME" = "ec-portfolio-demo-admin-5a49cc7398a4e653e084d73148"
          test "$VITE_API_BASE_URL" = "https://d1q0vfmnxby7vo.cloudfront.net"

      - name: Validate production artifacts
        env:
          RELEASE_SHA: ${{ github.sha }}
          STORE_DIST_DIR: apps/store-web/dist
          ADMIN_DIST_DIR: apps/admin-web/dist
        run: infra/runtime/demo/deploy-frontends.sh validate

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          role-session-name: gha-frontend-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Deploy immutable frontend release
        env:
          RELEASE_SHA: ${{ github.sha }}
          STORE_DIST_DIR: apps/store-web/dist
          ADMIN_DIST_DIR: apps/admin-web/dist
        run: infra/runtime/demo/deploy-frontends.sh deploy

  build-and-push-api:
    name: Publish Demo API image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo-backend
    concurrency:
      group: demo-backend-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_BACKEND_DEPLOY_ROLE_ARN: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY_NAME: ec-portfolio-demo-api
      BUILD_CONTEXT: apps/api
      MIGRATION_PATH: apps/api/src/main/resources/db/migration
      DESIRED_IMAGE_SHA_PARAMETER: /ec-portfolio/demo/deploy/desired-image-sha
      LAST_KNOWN_GOOD_IMAGE_SHA_PARAMETER: /ec-portfolio/demo/deploy/last-known-good-image-sha
      PENDING_MIGRATION_IMAGE_SHA_PARAMETER: /ec-portfolio/demo/deploy/pending-migration-image-sha
      IMAGE_TAG: ${{ github.sha }}
    # The release scope decided below, for deploy-api, which refuses anything
    # but an explicit true or false.
    outputs:
      api_changed: ${{ steps.scope.outputs.api_changed }}
      api_converge: ${{ steps.scope.outputs.api_converge }}
      runtime_pending: ${{ steps.scope.outputs.runtime_pending }}
    steps:
      - name: Checkout reviewed main commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a stale queued publication
        run: |
          set -euo pipefail
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main_sha"
          test "$GITHUB_SHA" = "$remote_main_sha"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Test API publication contract
        run: infra/runtime/demo/publish-api-image.test.sh

      - name: Validate publication environment
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$AWS_BACKEND_DEPLOY_ROLE_ARN" = \
            "arn:aws:iam::$AWS_ACCOUNT_ID:role/ec-portfolio-demo-github-backend-deploy"
          test "$ECR_REPOSITORY_NAME" = "ec-portfolio-demo-api"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          role-session-name: gha-backend-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      # Fail-closed: an unreadable or malformed desired or last known good SHA,
      # a missing commit or a git failure stops the job here, before anything is
      # published or recorded. A push that does not change the API build context
      # (an access, infrastructure or documentation change) skips the three steps
      # below: no image is published. This job never records the desired image
      # SHA; deploy-api does, once the host can run the release.
      - name: Decide what this push releases
        id: scope
        run: infra/runtime/demo/publish-api-image.sh release-scope

      - name: Publish the immutable API image
        if: steps.scope.outputs.api_changed == 'true'
        run: infra/runtime/demo/publish-api-image.sh ensure-image

      - name: Block an automatic release that changes Flyway migrations
        if: steps.scope.outputs.api_changed == 'true'
        run: infra/runtime/demo/publish-api-image.sh migration-guard

      - name: Require a recoverable rollback image
        if: steps.scope.outputs.api_changed == 'true'
        run: infra/runtime/demo/publish-api-image.sh assert-rollback-image

  deploy-api:
    name: Deploy Demo API
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-push-api
    runs-on: ubuntu-latest
    # The outermost boundary, not the thing that normally stops a stuck
    # deployment. That job belongs to the 900s polling budget in
    # deploy-runtime.sh, which gives up explicitly and fails the step. The 1200s
    # credential below is sized to outlast that polling window rather than to
    # terminate anything, so the deployment reaches a verdict while its
    # credential is still valid. A release that installs the host runtime before
    # recording its desired image spends the much shorter runtime install budget
    # first, inside the same credential.
    #
    # This timeout also has to cover the steps that run before a credential
    # exists at all: the checkout, both contract suites and the environment
    # validation. Its clock starts with the job while the credential clock
    # starts at issue time, so the ordering here is operational headroom, not a
    # proof about which of the two runs out first.
    #
    # deploy-runtime.test.sh reads both values from this file and enforces
    # configured waits < poll budget < role-duration-seconds < job timeout.
    timeout-minutes: 30
    environment: demo-backend
    concurrency:
      group: demo-backend-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_BACKEND_DEPLOY_ROLE_ARN: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ECR_REPOSITORY_NAME: ec-portfolio-demo-api
      DESIRED_IMAGE_SHA_PARAMETER: /ec-portfolio/demo/deploy/desired-image-sha
      PENDING_MIGRATION_IMAGE_SHA_PARAMETER: /ec-portfolio/demo/deploy/pending-migration-image-sha
      IMAGE_TAG: ${{ github.sha }}
      # The scope build-and-push-api decided. The job itself always runs once
      # that job succeeds, so deploy-frontends keeps waiting on it exactly as
      # before; a push with nothing to release ends in deploy-runtime.sh release
      # without any AWS call.
      RELEASE_API_CHANGED: ${{ needs.build-and-push-api.outputs.api_changed }}
      RELEASE_API_CONVERGE: ${{ needs.build-and-push-api.outputs.api_converge }}
      RELEASE_RUNTIME_PENDING: ${{ needs.build-and-push-api.outputs.runtime_pending }}
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject a stale queued deployment
        run: |
          set -euo pipefail
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main_sha"
          test "$GITHUB_SHA" = "$remote_main_sha"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Test runtime deployment contract
        run: |
          set -euo pipefail
          infra/runtime/demo/deploy-api.test.sh
          infra/runtime/demo/deploy-api-from-ssm.test.sh
          infra/runtime/demo/install-api-convergence.test.sh
          infra/runtime/demo/deploy-runtime.test.sh
          infra/runtime/demo/publish-api-image.test.sh

      # The scope gates the steps below with plain string comparisons, so an
      # undecided or malformed value must stop the job here rather than read as
      # false and skip the runtime gate.
      - name: Validate deployment environment
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$AWS_BACKEND_DEPLOY_ROLE_ARN" = \
            "arn:aws:iam::$AWS_ACCOUNT_ID:role/ec-portfolio-demo-github-backend-deploy"
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]
          test "$ECR_REPOSITORY_NAME" = "ec-portfolio-demo-api"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_API_CHANGED" =~ ^(true|false)$ ]]
          [[ "$RELEASE_API_CONVERGE" =~ ^(true|false)$ ]]
          [[ "$RELEASE_RUNTIME_PENDING" =~ ^(true|false)$ ]]

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          # Must exceed the runtime install budget plus the 900s poll budget in
          # deploy-runtime.sh with margin.
          # Bounded above by the max_session_duration on the backend deploy role
          # in Terraform, which deploy-runtime.test.sh checks against.
          role-duration-seconds: 1200
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      # A release that changes the host runtime as well as the API image must
      # not record its desired image before the host holds that runtime: boot
      # convergence runs the installed wrapper and cannot install artifacts, so
      # an offline host would start the new image on the old runtime at its next
      # boot. The host has to be Online and take the install here; otherwise
      # this step fails and the desired image SHA is never recorded.
      - name: Install the host runtime this release needs
        if: env.RELEASE_API_CHANGED == 'true' && env.RELEASE_RUNTIME_PENDING == 'true'
        run: infra/runtime/demo/deploy-runtime.sh install-runtime

      # Recorded here, under the same approval as the delivery below, rather than
      # in build-and-push-api: a deploy-api that is rejected, or that fails before
      # this step, leaves the desired image SHA as it was, so the host's next
      # boot cannot switch to a release this job never took. What it replaces is
      # read first, so the restore step at the end can put it back.
      - name: Remember the desired API image this release replaces
        id: previous
        if: env.RELEASE_API_CHANGED == 'true'
        run: infra/runtime/demo/publish-api-image.sh read-desired

      - name: Record the desired API image
        if: env.RELEASE_API_CHANGED == 'true'
        run: infra/runtime/demo/publish-api-image.sh record-desired

      - name: Release to the EC2 host when online
        run: infra/runtime/demo/deploy-runtime.sh release

      # A release that fails or is cancelled after its desired image SHA was
      # recorded would otherwise be retried by boot convergence at the host's
      # next boot, switching the API to a release this workflow did not
      # complete. Put the previous values back instead. An offline host is not a
      # failure: the release step defers to boot convergence and succeeds. If
      # the host did finish the release after the poll gave up, its next boot
      # returns it to the previous image, which is what this failed run reports.
      # This is best-effort. A normal cancel still runs this step, but a forced
      # cancel or a lost runner never reaches it, and restore-desired reports
      # RESTORE NOT CONFIRMED for any restore it cannot read back, so that an
      # operator can finish it by hand.
      - name: Restore the desired API image after a failed release
        if: (failure() || cancelled()) && steps.previous.outcome == 'success'
        env:
          PREVIOUS_DESIRED_IMAGE_SHA: ${{ steps.previous.outputs.previous_desired }}
          PREVIOUS_PENDING_MIGRATION_IMAGE_SHA: ${{ steps.previous.outputs.previous_pending }}
        run: infra/runtime/demo/publish-api-image.sh restore-desired

  # The access root owns the Terraform permission set policies. Its policy gate
  # and discovery decide whether an import or a policy change may be applied, so
  # their contracts are checked on every pull request, like the runtime suites.
  # No AWS call is made: both suites run against stubs.
  access-root-tests:
    name: Access root shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test access root policy gate and discovery
        run: |
          set -euo pipefail
          infra/terraform/access/scripts/policy-gate.test.sh
          infra/terraform/access/scripts/discover-permission-sets.test.sh

      # The measurement stack policies are pasted into the console from the
      # README, so the suite reads them from there: pinned digests, a shape gate
      # and mutants the gate must reject.
      - name: Test Phase 6C-5c measurement stack policies
        run: infra/terraform/access/scripts/measurement-stack-policy.test.sh

      # The cold standby runtime policies are pasted into the console from the
      # README too: pinned digests, a shape gate, the AccessAdmin read list and
      # mutants the gate must reject.
      - name: Test Phase 6C-5c cold standby runtime policies
        run: infra/terraform/access/scripts/cold-standby-policy.test.sh
