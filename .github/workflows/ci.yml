name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test backend
        run: ./gradlew clean build --no-daemon

      - name: Run backend integration tests
        run: ./gradlew integrationTest --no-daemon

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint store web
        run: npm run lint --workspace=store-web

      - name: Build store web
        run: npm run build --workspace=store-web

      - name: Lint admin web
        run: npm run lint --workspace=admin-web

      - name: Build admin web
        run: npm run build --workspace=admin-web

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify RDS CA bundle source
        run: |
          set -eu
          ca_file=apps/api/docker/aws-rds-ap-northeast-1-bundle.pem
          test -s "$ca_file"
          begin_count="$(grep -c '^-----BEGIN CERTIFICATE-----$' "$ca_file")"
          end_count="$(grep -c '^-----END CERTIFICATE-----$' "$ca_file")"
          test "$begin_count" -gt 0
          test "$begin_count" -eq "$end_count"
          ! grep -Eq '^-----BEGIN .*PRIVATE KEY-----$' "$ca_file"
          openssl crl2pkcs7 -nocrl -certfile "$ca_file" \
            | openssl pkcs7 -print_certs -noout >/dev/null

      - name: Build production image
        run: docker build --tag ec-api:ci apps/api

      - name: Verify image metadata
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' ec-api:ci)" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' ec-api:ci)" = '["java","-jar","/app/app.jar"]'
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' ec-api:ci)" = '{"8080/tcp":{}}'

      - name: Verify runtime image contents
        run: |
          docker run --rm --entrypoint sh ec-api:ci -c '
            set -eu
            test -f /app/app.jar
            test "$(find /app -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
            command -v curl
            ! command -v gradle
            test ! -e /workspace
            test ! -e /app/gradlew
            test ! -e /app/gradle
            test ! -e /app/src
            test ! -e /app/build
            ca_file=/etc/ssl/certs/aws-rds-ap-northeast-1-bundle.pem
            test -s "$ca_file"
            test -r "$ca_file"
            test "$(stat -c %a "$ca_file")" = "444"
            test "$(stat -c %u:%g "$ca_file")" = "0:0"
            grep -q "^-----BEGIN CERTIFICATE-----$" "$ca_file"
            ! grep -Eq "^-----BEGIN .*PRIVATE KEY-----$" "$ca_file"
          '

      - name: Verify runtime image contains no secret configuration
        run: |
          ! docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' ec-api:ci \
            | grep -Eq 'DB_PASSWORD|REDIS_PASSWORD|APP_AUTH_JWT_SECRET'
          ! docker history --no-trunc --format '{{.CreatedBy}}' ec-api:ci \
            | grep -Eq 'DB_PASSWORD|REDIS_PASSWORD|APP_AUTH_JWT_SECRET'
