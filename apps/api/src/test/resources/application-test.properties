# External infrastructure is not required for application context tests.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.flyway.enabled=false
spring.main.lazy-initialization=true

# Actuator does not access external infrastructure in regular tests.
management.endpoint.health.group.readiness.include=readinessState
management.health.db.enabled=false
management.health.redis.enabled=false

# Auth
app.auth.jwt.secret=test-only-dummy-jwt-secret-at-least-32-bytes-long

# CORS
app.cors.allowed-origins=https://test.example
