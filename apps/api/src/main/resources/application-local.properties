# Database
spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:ec}
spring.datasource.username=${DB_USERNAME:ec_user}
spring.datasource.password=${DB_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6380}

# Auth
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET}

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
