spring.application.name=api

# Database
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Server
server.port=8080

# OpenAPI
app.openapi.enabled=false
springdoc.api-docs.enabled=${app.openapi.enabled}
springdoc.swagger-ui.enabled=${app.openapi.enabled}
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Auth
app.auth.jwt.access-token-expiration-seconds=${APP_AUTH_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
