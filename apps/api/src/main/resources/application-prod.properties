# Database
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=verify-full&serverSslCert=/etc/ssl/certs/aws-rds-ap-northeast-1-bundle.pem&fallbackToSystemTrustStore=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# Actuator
management.endpoint.health.group.readiness.include=readinessState,db,redis

# Auth
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# OpenAPI
app.openapi.enabled=${APP_OPENAPI_ENABLED:false}

# Logging
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=prod
